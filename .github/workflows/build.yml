name: build-apk

on:
  push:
    branches: [main, "stage*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 저장소에 gradle wrapper를 두지 않고 Actions에서 Gradle을 받아 쓴다
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests + Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Secrets는 2개만 사용. alias는 고정값, 키 비밀번호는 keystore 비밀번호와 같음
          KEY_ALIAS: tvremocon
        run: |
          set -o pipefail
          export KEY_PASSWORD="$KEYSTORE_PASSWORD"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            # 붙여넣기 때 섞인 공백·줄바꿈 제거 후 디코딩
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            KIND=release; TASK=:app:assembleRelease
          else
            echo "::warning::서명 Secrets가 없어 debug APK로 빌드합니다 (ARCHITECTURE.md 5절)"
            KIND=debug; TASK=:app:assembleDebug
          fi
          if ! gradle --no-daemon :app:testDebugUnitTest $TASK 2>&1 | tee build.log; then
            # 실패 원인을 Actions 주석(annotation)으로 남긴다
            grep -E '^e: |error:|FAILED' build.log | head -20 | sed 's/^/::error::/' || true
            python3 .github/scripts/test_failures.py || true
            rm -f "$RUNNER_TEMP/release.jks"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p out
          cp "app/build/outputs/apk/$KIND/app-$KIND.apk" "out/smart-tv-remocon-${KIND}-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: smart-tv-remocon-apk
          path: out/*.apk
          if-no-files-found: error
