<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TV 리모컨</title>
<style>
:root{
  --bg:#111317; --panel:#1a1d23; --key:#252932; --key-hi:#2f3440; --line:#2d313a;
  --fg:#e8eaee; --mut:#8d95a3; --acc:#ff4d7d; --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.4 system-ui,-apple-system,"Noto Sans KR",sans-serif;user-select:none;-webkit-user-select:none}
.wrap{max-width:440px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
h1{font-size:18px;margin:0;font-weight:700}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--mut)}
.pill::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:6px;vertical-align:1px}
.pill.on{color:var(--ok)} .pill.on::before{background:var(--ok)}
.pill.wait{color:var(--warn)} .pill.wait::before{background:var(--warn)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.conn{display:flex;gap:8px}
.conn input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit}
button{font:inherit;color:var(--fg);background:var(--key);border:0;border-radius:12px;cursor:pointer;touch-action:manipulation}
button:active{background:var(--key-hi);transform:scale(.97)}
.btn-acc{background:var(--acc);color:#fff;padding:10px 16px;font-weight:600}
.btn-acc:active{background:#e23d6b}
.label{font-size:12px;color:var(--mut);margin:0 0 8px 2px}

.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.app{height:54px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;line-height:1.2}

.middle{display:grid;grid-template-columns:64px 1fr 64px;gap:12px;align-items:center;margin:14px 0}
.rocker{display:flex;flex-direction:column;background:var(--key);border-radius:32px;overflow:hidden}
.rocker button{background:transparent;height:64px;border-radius:0;font-size:24px}
.rocker button:active{background:var(--key-hi)}
.rocker span{text-align:center;font-size:11px;color:var(--mut);padding:2px 0}

.dpad{position:relative;width:100%;max-width:230px;aspect-ratio:1;margin:0 auto;border-radius:50%;background:var(--key)}
.dpad button{position:absolute;background:transparent;border-radius:0;font-size:22px;color:var(--mut)}
.dpad button:active{color:var(--fg);background:rgba(255,255,255,.06)}
.dpad .u{top:0;left:30%;width:40%;height:30%;border-radius:50% 50% 0 0/100% 100% 0 0}
.dpad .d{bottom:0;left:30%;width:40%;height:30%}
.dpad .l{left:0;top:30%;width:30%;height:40%}
.dpad .r{right:0;top:30%;width:30%;height:40%}
.dpad .ok{top:30%;left:30%;width:40%;height:40%;border-radius:50%;background:var(--key-hi);color:var(--fg);font-size:16px;font-weight:700}

.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row button{height:48px;font-size:14px}
.power{color:var(--err);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TV 리모컨</h1>
    <span id="state" class="pill">연결 안 됨</span>
  </header>

  <div class="panel">
    <p class="label">TV IP (2단계부터 연결, 3단계부터 자동 찾기)</p>
    <div class="conn">
      <input id="ip" placeholder="192.168.0.10" inputmode="decimal" autocomplete="off">
      <button class="btn-acc" data-act="connect">연결</button>
    </div>
  </div>

  <div class="panel">
    <p class="label">앱 바로 실행</p>
    <div class="apps" id="apps"></div>
  </div>

  <div class="middle">
    <div class="rocker">
      <button data-req="ssap://audio/volumeUp" aria-label="볼륨 올리기">＋</button>
      <span>음량</span>
      <button data-req="ssap://audio/volumeDown" aria-label="볼륨 내리기">－</button>
    </div>
    <div class="dpad">
      <button class="u" data-btn="UP" aria-label="위">▲</button>
      <button class="l" data-btn="LEFT" aria-label="왼쪽">◀</button>
      <button class="ok" data-btn="ENTER">확인</button>
      <button class="r" data-btn="RIGHT" aria-label="오른쪽">▶</button>
      <button class="d" data-btn="DOWN" aria-label="아래">▼</button>
    </div>
    <div class="rocker">
      <button data-req="ssap://media.controls/play" aria-label="재생">▶</button>
      <span>재생</span>
      <button data-req="ssap://media.controls/pause" aria-label="일시정지">❚❚</button>
    </div>
  </div>

  <div class="row">
    <button data-btn="BACK">뒤로</button>
    <button data-btn="HOME">홈</button>
    <button data-act="mute">음소거</button>
    <button class="power" data-req="ssap://system/turnOff">전원</button>
  </div>

  <footer id="ver"></footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  // 기본 즐겨찾기 — 실TV listLaunchPoints로 확인한 ID (WEBOS_API.md 5절)
  var FAVORITES = [
    { title: "YouTube", id: "youtube.leanback.v4" },
    { title: "Netflix", id: "netflix" },
    { title: "TVING", id: "cj.eandm" },
    { title: "wavve", id: "pooq" },
    { title: "쿠팡플레이", id: "coupangplay" },
    { title: "Disney+", id: "com.disney.disneyplus-prod" }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var hasBridge = typeof window.AndroidBridge !== "undefined";
  var toastTimer = null;

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  function renderApps() {
    $("apps").innerHTML = FAVORITES.map(function (a) {
      return '<button class="app" data-launch="' + a.id + '">' + a.title + "</button>";
    }).join("");
  }

  // 1단계: 아직 TV 통신 없음 — 무엇이 보내질지 표시만 한다
  function notYet(what) { toast("2단계에서 연결됩니다 · " + what); }

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    if (b.dataset.launch) return notYet("launch " + b.dataset.launch);
    if (b.dataset.req) return notYet(b.dataset.req.replace("ssap://", ""));
    if (b.dataset.btn) return notYet("button " + b.dataset.btn);
    if (b.dataset.act === "connect") return notYet("connect " + ($("ip").value.trim() || "(IP 없음)"));
    if (b.dataset.act === "mute") return notYet("audio/setMute");
  });

  // Kotlin → JS 이벤트 (ARCHITECTURE.md 3절). 1단계에서는 받기만 한다.
  window.onBridge = function (type, dataJson) {
    try { console.log("bridge", type, JSON.parse(dataJson)); } catch (e) {}
  };
  // 안드로이드 뒤로 키: 처리했으면 true
  window.onBackKey = function () { return false; };

  try { var last = localStorage.getItem("last_ip"); if (last) $("ip").value = last; } catch (e) {}
  $("ip").addEventListener("change", function () {
    try { localStorage.setItem("last_ip", $("ip").value.trim()); } catch (e) {}
  });

  var ver = "브라우저 미리보기";
  if (hasBridge) { try { ver = "v" + JSON.parse(window.AndroidBridge.appInfo()).version; } catch (e) {} }
  $("ver").textContent = ver + " · 1단계 화면 골격";

  renderApps();
})();
</script>
</body>
</html>
