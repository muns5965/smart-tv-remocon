<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TV 리모컨</title>
<style>
/* One UI 스타일 (2차 시안). 라이트가 기본, html[data-theme=dark]는 Kotlin이 시스템 설정에 맞춰 붙인다 */
:root{
  --bg:#f2f2f4; --card:#ffffff; --key:#f1f3f6; --pad:#e8ebf0; --press:#dde1e7; --line:#ececf0;
  --tint:#dbe8fd; --tint-fg:#1a5fc8; --acc:#1f6fe5; --acc-press:#1a5fc8;
  --fg:#111111; --mut:#5a5f66; --ok:#1e8e3e; --warn:#b26a00; --err:#d93025; --dim:rgba(0,0,0,.38); --toast:#222;
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#000000; --card:#1c1c1c; --key:#2c2c2c; --pad:#333333; --press:#454545; --line:#2a2a2a;
  --tint:#1b3a66; --tint-fg:#9cc4ff; --acc:#1f6fe5; --acc-press:#3a82ef;
  --fg:#fafafa; --mut:#b3b3b3; --ok:#3ddc84; --warn:#fbbf24; --err:#ff6b6b; --dim:rgba(0,0,0,.6); --toast:#3a3a3a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.4 system-ui,-apple-system,"Noto Sans KR",sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:var(--fg);background:var(--key);border:0;border-radius:18px;cursor:pointer;touch-action:manipulation;padding:0}
button:active{background:var(--press)}
button:disabled{opacity:.45}
svg{display:block;flex:none}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.fill{fill:currentColor;stroke:none}

.wrap{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px;
  padding:calc(8px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.bar{height:52px;display:flex;align-items:center;gap:4px;padding-left:8px}
.bar h1{flex:1;margin:0;font-size:22px;font-weight:700}
.icon-btn{width:48px;height:48px;border-radius:24px;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.card{background:var(--card);border-radius:26px}

/* TV 카드: 이름 · 모델 · 상태 */
.tvcard{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;background:var(--card);border-radius:26px;width:100%}
.tvcard:active{background:var(--press)}
.tvcard .badge{width:48px;height:48px;border-radius:24px;background:var(--tint);color:var(--tint-fg);display:flex;align-items:center;justify-content:center;flex:none}
.tvcard .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tvcard b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvcard small{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:4px;background:var(--mut);flex:none}
.status.on::before{background:var(--ok)} .status.wait::before{background:var(--warn)} .status.bad::before{background:var(--err)}
.chev{color:var(--mut)}

/* 앱 바로 실행: 옆으로 넘기는 한 줄 */
.apps-card{padding:12px 4px 12px 12px}
.card-h{margin:0 0 8px 4px;font-size:13px;font-weight:600;color:var(--mut)}
.apps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-right:8px}
.apps::-webkit-scrollbar{display:none}
.app{width:68px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;padding:4px 0;border-radius:16px}
.app .mono{width:46px;height:46px;border-radius:15px;background:var(--key);color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.app .mono.img{background:transparent;overflow:hidden}
.app .mono img,.inico img{width:100%;height:100%;object-fit:cover;display:block}
.inico{width:30px;height:30px;border-radius:8px;background:#3a3a3a;overflow:hidden;flex:none;display:flex}
.inico img{object-fit:contain}
.app span:last-child{font-size:12px;white-space:nowrap;max-width:66px;overflow:hidden;text-overflow:ellipsis}

/* 조작 카드 */
.ctrl{padding:12px 12px 14px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:var(--key);border-radius:22px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:18px;background:transparent;color:var(--mut);font-size:14px;font-weight:500}
.seg button.on{background:var(--tint);color:var(--tint-fg);font-weight:700}
.middle{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.rocker{width:58px;height:172px;border-radius:29px;background:var(--pad);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 0}
.rocker button{width:54px;height:54px;border-radius:27px;background:transparent;display:flex;align-items:center;justify-content:center}
.rocker button:active{background:var(--press)}
.rocker .mid{width:46px;height:40px;border-radius:20px;color:var(--mut)}
.rocker span{font-size:12px;color:var(--mut)}
.dpad{position:relative;width:180px;height:180px;border-radius:90px;background:var(--pad);flex:none}
.dpad button{position:absolute;background:transparent;border-radius:28px;display:flex;align-items:center;justify-content:center}
.dpad button:active{background:var(--press)}
.dpad .u{left:63px;top:3px;width:54px;height:56px}
.dpad .d{left:63px;bottom:3px;width:54px;height:56px}
.dpad .l{top:63px;left:3px;width:56px;height:54px}
.dpad .r{top:63px;right:3px;width:56px;height:54px}
.dpad .ok{left:56px;top:56px;width:68px;height:68px;border-radius:34px;background:var(--acc);color:#fff;font-size:15px;font-weight:700}
.dpad .ok:active{background:var(--acc-press)}
.pad{display:none;width:180px;height:180px;border-radius:32px;background:var(--pad);touch-action:none;flex:none;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mut);font-size:12px;line-height:1.6;text-align:center}
.pad.active{background:var(--press)}
body.mode-pad .pad{display:flex}
body.mode-pad .dpad{display:none}
.row4,.row3{display:grid;gap:8px}
.row4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row4 button,.row3 button{height:46px;display:flex;align-items:center;justify-content:center}
.row4 button{height:56px;flex-direction:column;gap:2px}
.row4 button span{font-size:11px;color:var(--mut)}
.power-wrap{display:flex;justify-content:center;margin-top:auto;padding-top:4px}
.power{width:62px;height:62px;border-radius:31px;background:var(--card);color:var(--err);display:flex;align-items:center;justify-content:center}
.power.armed{background:var(--err);color:#fff}

/* 전체 화면 페이지: TV 연결, 설정, 디버그 */
.page{position:fixed;inset:0;z-index:8;background:var(--bg);overflow:auto;transform:translateX(100%);transition:transform .22s;visibility:hidden}
.page.show{transform:none;visibility:visible}
.page .inner{max-width:460px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.sect{display:flex;align-items:center;justify-content:space-between;margin:10px 4px 0 12px;font-size:14px;font-weight:700;color:var(--mut);min-height:24px}
.list{background:var(--card);border-radius:26px;padding:4px;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 14px;border-radius:22px;background:transparent;text-align:left;width:100%}
.item + .item{position:relative}
.item + .item::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--line)}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t b{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{font-size:13px;color:var(--mut)}
.item.sel{background:var(--tint)} .item.sel + .item::before{display:none}
.item.sel .t small,.item.sel .tag{color:var(--tint-fg)}
.tag{font-size:12px;color:var(--mut);white-space:nowrap}
.tag.on{color:var(--tint-fg);font-weight:700}
.item .mini{height:36px;padding:0 12px;border-radius:18px;font-size:13px;background:var(--key);flex:none}
.item .danger{color:var(--err)}
.item .danger.armed{background:var(--err);color:#fff}
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 4px;color:var(--tint-fg)}
.hero p{margin:0;font-size:14px;line-height:1.6;color:var(--mut);text-align:center}
.iprow{background:var(--card);border-radius:26px;padding:12px;display:flex;gap:8px}
input{flex:1;min-width:0;height:48px;background:var(--key);border:0;color:var(--fg);border-radius:18px;padding:0 14px;font:inherit;font-size:14px;user-select:text;-webkit-user-select:text}
.btn-acc{background:var(--acc);color:#fff;font-weight:700;height:48px;padding:0 18px}
.btn-acc:active{background:var(--acc-press)}
.switch{width:46px;height:28px;border-radius:14px;background:#b9bec6;position:relative;flex:none;transition:.15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:.15s}
.switch.on{background:var(--acc)} .switch.on::after{left:21px}
.speed{display:flex;align-items:center;gap:10px;padding:0 14px 12px;font-size:13px;color:var(--mut)}
.speed input{flex:1;height:28px;padding:0;background:transparent;accent-color:var(--acc)}
.speed b{width:30px;text-align:right;color:var(--fg)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:18px;font-size:14px;color:var(--mut);text-align:center;line-height:1.6}

/* 디버그 */
.dbg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:var(--card);border-radius:26px;padding:12px}
.dbg button{min-height:48px;padding:6px 10px;font-size:13px;line-height:1.3}
.log{background:var(--card);border-radius:20px;padding:12px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;
  min-height:160px;max-height:50vh;overflow:auto;user-select:text;-webkit-user-select:text}

/* 아래에서 올라오는 시트: 허용 대기, PIN, 인증서 경고, 외부입력 */
.dim{position:fixed;inset:0;background:var(--dim);display:none;z-index:10}
.dim.show{display:block}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:11;background:var(--card);
  border-radius:28px;padding:10px 20px 16px;transform:translateY(120%);transition:.22s;max-height:86vh;overflow:auto;max-width:460px;margin:0 auto}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:20px;margin:0 4px 6px}
.sheet p{color:var(--mut);margin:0 4px 14px;font-size:14px;line-height:1.5}
.sheet .acts{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:12px}
.sheet .txt{background:transparent;height:44px;padding:0 12px;border-radius:22px;font-size:14px;color:var(--mut)}
.sheet .txt.blue{color:var(--tint-fg);font-weight:700;font-size:15px}
.sheet .list{background:var(--key);padding:4px}
.pinbox{font:600 28px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:8px;text-align:center;padding:16px 8px;
  background:var(--bg);border-radius:20px;min-height:64px;margin:0 0 12px;word-break:break-all}
.pinbox.empty{font-family:inherit;font-size:15px;font-weight:400;line-height:2;letter-spacing:0;color:var(--mut)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keypad button{height:56px;font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center}
.keypad .ok{background:var(--acc);color:#fff;font-size:16px;font-weight:700}
.keypad .ok:active{background:var(--acc-press)}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:20;
  background:var(--toast);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<!-- 아이콘 모음 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></symbol>
  <symbol id="i-cast" viewBox="0 0 24 24"><path d="M3 15V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/><path d="M3 18a2 2 0 0 1 2 2M3 14a6 6 0 0 1 6 6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M16 9l5 6M21 9l-5 6"/></symbol>

  <symbol id="i-rew" viewBox="0 0 24 24"><path d="M11 6v12L3 12zM20 6v12l-8-6z"/></symbol>
  <symbol id="i-ff" viewBox="0 0 24 24"><path d="M4 6v12l8-6zM13 6v12l8-6z"/></symbol>
  <symbol id="i-pp" viewBox="0 0 24 24"><path d="M4 6v12l8-6z"/><rect x="14" y="6" width="2.5" height="12" rx="1"/><rect x="18.5" y="6" width="2.5" height="12" rx="1"/></symbol>

  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 10"/></symbol>
  <symbol id="i-del" viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7z"/><path d="M12 9l5 6M17 9l-5 6"/></symbol>

</svg>

<div class="wrap">
  <header class="bar">
    <h1>TV 리모컨</h1>
    <button class="icon-btn" data-act="cast" aria-label="화면 미러링"><svg class="ico"><use href="#i-cast"/></svg></button>
    <button class="icon-btn" data-act="settings" aria-label="설정"><svg class="ico fill"><use href="#i-more"/></svg></button>
  </header>

  <button class="tvcard" data-act="tvcard">
    <span class="badge"><svg class="ico" style="width:24px;height:24px"><use href="#i-tv"/></svg></span>
    <span class="t">
      <b id="tvName">TV 리모컨</b>
      <small id="tvModel"></small>
      <small id="status" class="status">연결 안 됨</small>
    </span>
    <svg class="ico chev" style="width:20px;height:20px"><use href="#i-chev"/></svg>
  </button>

  <section class="card apps-card">
    <p class="card-h">앱 바로 실행</p>
    <div class="apps" id="apps"></div>
  </section>

  <section class="card ctrl">
    <div class="seg" id="seg">
      <button data-mode="dpad">방향키</button>
      <button data-mode="pad">터치패드</button>
    </div>
    <div class="middle">
      <div class="rocker">
        <button data-req="ssap://audio/volumeUp" data-repeat="1" aria-label="볼륨 올리기"><svg class="ico"><use href="#i-plus"/></svg></button>
        <button class="mid" data-act="mute" aria-label="음소거"><svg class="ico" style="width:20px;height:20px"><use href="#i-mute"/></svg></button>
        <button data-req="ssap://audio/volumeDown" data-repeat="1" aria-label="볼륨 내리기"><svg class="ico"><use href="#i-minus"/></svg></button>
      </div>
      <div class="dpad">
        <button class="u" data-btn="UP" data-repeat="1" aria-label="위"><svg class="ico"><use href="#i-up"/></svg></button>
        <button class="l" data-btn="LEFT" data-repeat="1" aria-label="왼쪽"><svg class="ico"><use href="#i-back"/></svg></button>
        <button class="ok" data-btn="ENTER">확인</button>
        <button class="r" data-btn="RIGHT" data-repeat="1" aria-label="오른쪽"><svg class="ico"><use href="#i-chev"/></svg></button>
        <button class="d" data-btn="DOWN" data-repeat="1" aria-label="아래"><svg class="ico"><use href="#i-down"/></svg></button>
      </div>
      <div class="pad" id="pad">
        <svg class="ico" style="width:30px;height:30px"><use href="#i-hand"/></svg>
        <span>드래그 · 커서 이동<br>탭 · 클릭<br>두 손가락 위아래 · 스크롤</span>
      </div>
      <div class="rocker">
        <button data-req="ssap://tv/channelUp" data-repeat="1" aria-label="채널 올리기"><svg class="ico"><use href="#i-up"/></svg></button>
        <span>채널</span>
        <button data-req="ssap://tv/channelDown" data-repeat="1" aria-label="채널 내리기"><svg class="ico"><use href="#i-down"/></svg></button>
      </div>
    </div>
    <div class="row4">
      <button data-btn="BACK"><svg class="ico" style="width:20px;height:20px"><use href="#i-return"/></svg><span>뒤로</span></button>
      <button data-btn="HOME"><svg class="ico" style="width:20px;height:20px"><use href="#i-home"/></svg><span>홈</span></button>
      <button data-act="inputs"><svg class="ico" style="width:20px;height:20px"><use href="#i-input"/></svg><span>입력</span></button>
      <button data-btn="MENU" aria-label="TV 설정"><svg class="ico" style="width:20px;height:20px;stroke-width:1.7"><use href="#i-gear"/></svg><span>설정</span></button>
    </div>
    <div class="row3">
      <button data-req="ssap://media.controls/rewind" aria-label="되감기"><svg class="ico fill"><use href="#i-rew"/></svg></button>
      <button data-act="playPause" aria-label="재생 / 일시정지"><svg class="ico fill"><use href="#i-pp"/></svg></button>
      <button data-req="ssap://media.controls/fastForward" aria-label="빨리감기"><svg class="ico fill"><use href="#i-ff"/></svg></button>
    </div>
  </section>

  <div class="power-wrap">
    <button class="power" id="power" data-act="power" aria-label="전원 끄기"><svg class="ico" style="width:26px;height:26px;stroke-width:2.2"><use href="#i-power"/></svg></button>
  </div>
</div>

<div class="page" id="page"><div class="inner" id="pageInner"></div></div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  // 기본 즐겨찾기 — 실TV listLaunchPoints로 확인한 ID (WEBOS_API.md 5절)
  var FAVORITES = [
    { title: "YouTube", id: "youtube.leanback.v4" },
    { title: "Netflix", id: "netflix" },
    { title: "TVING", id: "cj.eandm" },
    { title: "wavve", id: "pooq" },
    { title: "쿠팡플레이", id: "coupangplay" },
    { title: "Disney+", id: "com.disney.disneyplus-prod" }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var B = window.AndroidBridge || null;

  // 화면 상태
  var S = {
    conn: "idle",        // idle | connecting | prompt | pin | connected | failed | closed
    tv: null,            // {id, ip, name}
    phase: "",           // 자동 흐름: "last"(마지막 TV 시도) → "discover"(검색) → ""
    searching: false,
    found: [],           // 이번 검색에서 찾은 TV
    sheet: "",           // 열린 시트: prompt | pin | cert | inputs
    page: ""             // 열린 페이지: connect | settings | debug
  };
  var seq = 0, pending = {};

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var haptic = load("haptic") !== "0";        // 터치 진동 (기본 켬)

  // ------------------------------------------------------------ 테마 (Kotlin이 시스템 다크 모드를 알려 줌)
  window.setTheme = function (dark) { document.documentElement.setAttribute("data-theme", dark ? "dark" : "light"); };
  if (B && B.isDark) { try { window.setTheme(B.isDark()); } catch (e) {} }
  else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) window.setTheme(true);

  // ------------------------------------------------------------ 공통 UI
  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function icon(id, cls) { return '<svg class="ico' + (cls ? " " + cls : "") + '"><use href="#i-' + id + '"/></svg>'; }
  function tvLabel(t) { return (t && (t.name || "").replace(/^\[LG\]\s*/, "")) || "LG TV"; }
  function savedTvs() { try { return JSON.parse(B.savedTvs()); } catch (e) { return []; } }
  function savedById(id) { return savedTvs().filter(function (t) { return t.id === id; })[0] || null; }

  // ------------------------------------------------------------ TV 아이콘 (앱·외부입력)
  // TV가 주는 주소는 https://<TV>:3001/resources/… (자체 서명) → Kotlin fetchIcon이 받아 data: URI로 돌려줌.
  // localStorage "icon:<appId>" = {url, data}. 주소가 같으면 다시 받지 않음
  var iconWant = {};
  function iconGet(key) { try { return JSON.parse(load("icon:" + key) || "null"); } catch (e) { return null; } }
  function needIcon(key, url, force) {
    if (!key || !url || !B || !B.fetchIcon) return;
    var c = iconGet(key);
    if (!force && c && c.url === url) return;
    if (iconWant[key] === url) return;
    iconWant[key] = url;
    B.fetchIcon(key, url);
  }
  function loadAppIcons(force) {
    rq("ssap://com.webos.applicationManager/listLaunchPoints", null, function (d) {
      var lp = d.ok && d.payload && d.payload.launchPoints;
      if (!lp) { if (force) logLine("앱 목록 실패: " + (d.error || "")); return; }
      var by = {};
      lp.forEach(function (a) { by[a.id] = a; });
      FAVORITES.forEach(function (f) {
        var a = by[f.id];
        if (a) needIcon(f.id, a.icon || a.largeIcon, force);
        else if (force) logLine("아이콘: " + f.title + " — TV에 없는 앱");
      });
    }, true);
  }
  function onIcon(d) {
    delete iconWant[d.key];
    if (d.ok && d.data) store("icon:" + d.key, JSON.stringify({ url: d.url, data: d.data }));
    if (S.page === "debug") logLine("아이콘 " + d.key + ": " + (d.ok ? "성공 " + d.size + "바이트" : "실패 " + d.error));
    if (d.ok) { renderApps(); if (S.sheet === "inputs") renderInputs(false); }
  }
  function renderApps() {
    $("apps").innerHTML = FAVORITES.map(function (a) {
      var c = iconGet(a.id);
      return '<button class="app" data-launch="' + esc(a.id) + '"><span class="mono' + (c ? " img" : "") + '">' +
        (c ? '<img src="' + esc(c.data) + '" alt="">' : esc(a.title.charAt(0).toUpperCase())) +
        "</span><span>" + esc(a.title) + "</span></button>";
    }).join("");
  }

  var STATUS = {
    idle: ["연결 안 됨", ""], closed: ["연결 끊김", ""], failed: ["연결 실패", "bad"],
    connecting: ["연결 중…", "wait"], prompt: ["TV에서 허용 대기", "wait"], pin: ["PIN 입력 대기", "wait"],
    connected: ["연결됨", "on"]
  };
  function render() {
    var c = S.conn, m = STATUS[c] || STATUS.idle;
    if (S.searching && c !== "connected") m = ["TV 찾는 중…", "wait"];
    var st = $("status");
    st.textContent = m[0] + (S.tv && S.tv.ip ? " · " + S.tv.ip : "");
    st.className = "status " + m[1];
    $("tvName").textContent = S.tv ? tvLabel(S.tv) : "TV를 연결하세요";
    var sv = S.tv && S.tv.id ? savedById(S.tv.id) : null;
    $("tvModel").textContent = sv && sv.model ? sv.model : (S.tv ? "LG webOS TV" : "같은 Wi-Fi의 LG TV");
  }

  // ------------------------------------------------------------ 시트 (허용 대기, PIN, 인증서, 외부입력)
  function openSheet(kind, html) {
    S.sheet = kind;
    $("sheet").innerHTML = '<div class="grab"></div>' + html;
    $("sheet").classList.add("show");
    $("dim").classList.add("show");
  }
  function closeSheet() {
    S.sheet = "";
    $("sheet").classList.remove("show");
    $("dim").classList.remove("show");
  }

  // ------------------------------------------------------------ 페이지 (TV 연결, 설정, 디버그)
  function openPage(kind, html) {
    S.page = kind;
    $("pageInner").innerHTML = html;
    $("page").classList.add("show");
  }
  function closePage() {
    S.page = "";
    $("page").classList.remove("show");
  }
  function pageBar(title) {
    return '<header class="bar" style="padding-left:0"><button class="icon-btn" data-act="closePage" aria-label="뒤로">' +
      icon("back") + "</button><h1>" + esc(title) + "</h1></header>";
  }

  // TV 연결: 찾은 TV + 저장된 TV. 누르면 바로 연결
  function showConnect() {
    var byId = {};
    S.found.forEach(function (t) { byId[t.id] = t; });
    savedTvs().forEach(function (t) { if (!byId[t.id]) byId[t.id] = t; });
    var items = Object.keys(byId).map(function (k) { return byId[k]; });
    var html = pageBar("TV 연결");
    html += '<div class="hero"><svg viewBox="0 0 24 24" class="ico" style="width:64px;height:64px;stroke-width:1.4"><use href="#i-tv"/></svg>' +
      "<p>" + (S.searching ? '<span class="spin"></span> 같은 Wi-Fi에서 LG TV를 찾는 중…' : "목록에서 TV를 누르면 바로 연결합니다.") + "</p></div>";
    html += '<div class="sect"><span>TV 목록</span><button class="icon-btn" data-act="find" aria-label="다시 찾기" style="width:44px;height:44px">' +
      icon("refresh") + "</button></div>";
    html += '<div class="list">' + (items.length ? items.map(function (t) {
      var cur = S.tv && S.tv.id === t.id && S.conn === "connected";
      var foundNow = S.found.some(function (f) { return f.id === t.id; });
      return '<button class="item' + (cur ? " sel" : "") + '" data-pick="' + esc(t.id) + '">' + icon("tv") +
        '<span class="t"><b>' + esc(tvLabel(t)) + "</b><small>" + esc(t.model ? t.model + " · " : "") + esc(t.ip) +
        (foundNow ? "" : " · 저장됨") + "</small></span>" +
        (cur ? '<span class="tag on">연결됨</span>' : (t.known ? '<span class="tag">연결한 적 있음</span>' : "")) + "</button>";
    }).join("") : '<div class="empty">' + (S.searching ? "찾는 중…" :
      "찾은 TV가 없습니다.<br>TV가 켜져 있는지, 같은 Wi-Fi인지 확인하거나 IP로 연결하세요.") + "</div>") + "</div>";
    html += '<div class="sect">목록에 없으면</div><div class="iprow">' +
      '<input id="ip" placeholder="IP 직접 입력 (예: 192.168.0.10)" inputmode="decimal" autocomplete="off" aria-label="TV IP 주소">' +
      '<button class="btn-acc" data-act="connectIp">연결</button></div>';
    var keep = S.page === "connect" ? $("ip") : null, ipVal = keep ? keep.value : "";
    openPage("connect", html);
    if (ipVal) $("ip").value = ipVal;
  }

  // 설정: 연결된 TV, 저장된 TV(연결·등록 해제), 리모컨, 화면, 디버그, 정보
  function showSettings() {
    var saved = savedTvs();
    var html = pageBar("설정");
    html += '<div class="sect">연결 및 기기</div><div class="list">' +
      '<button class="item" data-act="tvcard"><span class="t"><b>연결된 TV</b><small>' +
      esc(S.conn === "connected" && S.tv ? tvLabel(S.tv) + " · " + S.tv.ip : "없음 · 눌러서 연결") + "</small></span>" + icon("chev", "chev") + "</button></div>";
    html += '<div class="sect">저장된 TV</div><div class="list">' + (saved.length ? saved.map(function (t) {
      var isCur = S.tv && S.tv.id === t.id && S.conn === "connected";
      return '<div class="item"><span class="t"><b>' + esc(tvLabel(t)) + "</b><small>" + esc(t.ip) +
        (t.model ? " · " + esc(t.model) : "") + (isCur ? " · 연결됨" : "") + "</small></span>" +
        (isCur ? "" : '<button class="mini" data-conn="' + esc(t.id) + '">연결</button>') +
        '<button class="mini danger" data-forget="' + esc(t.id) + '">등록 해제</button></div>';
    }).join("") : '<div class="empty">아직 없습니다.</div>') + "</div>";
    html += '<div class="sect">리모컨</div><div class="list">' +
      '<button class="item" data-act="toggleHaptic"><span class="t"><b>터치 진동</b><small>버튼을 누르면 짧게 진동</small></span>' +
      '<span class="switch' + (haptic ? " on" : "") + '" id="hapticSw"></span></button>' +
      '<div class="item" style="padding-bottom:4px"><span class="t"><b>터치패드 커서 속도</b></span></div>' +
      '<div class="speed"><span>느림</span><input type="range" id="speed" min="0.6" max="3" step="0.1" value="' + speed +
      '" aria-label="커서 속도"><span>빠름</span><b id="speedv">' + speed.toFixed(1) + "</b></div></div>";
    html += '<div class="sect">화면</div><div class="list">' +
      '<button class="item" data-act="cast"><span class="t"><b>화면 미러링</b><small>Smart View · DeX 열기</small></span>' + icon("chev", "chev") + "</button>" +
      '<div class="item"><span class="t"><b>테마</b><small>시스템 설정을 따름 (라이트 / 다크)</small></span></div></div>';
    html += '<div class="sect">개발</div><div class="list">' +
      '<button class="item" data-act="debug"><span class="t"><b>API 테스트 (디버그)</b><small>채널 · 외부입력 · MENU 등 실TV 응답 확인</small></span>' + icon("chev", "chev") + "</button></div>";
    html += '<div class="sect">정보</div><div class="list"><div class="item"><span class="t"><b>앱 정보</b><small>' +
      esc(verText) + "</small></span></div></div>";
    openPage("settings", html);
  }

  function showPrompt() {
    openSheet("prompt", "<h2>TV 화면에서 '허용'을 눌러 주세요</h2><p>" + esc(tvLabel(S.tv)) +
      "에 연결 요청을 보냈습니다. 처음 한 번만 하면 됩니다.</p>" +
      '<div class="acts"><span></span><button class="txt blue" data-act="cancel">취소</button></div>');
  }
  // 처음 등록: TV 화면에 뜬 숫자를 숫자판으로 입력 (시스템 키보드를 띄우지 않음). 길이 제한 없음
  var pinVal = "";
  function showPin(msg) {
    var wrong = msg && msg.indexOf("맞지 않") >= 0;
    pinVal = "";
    var keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9"].map(function (k) {
      return '<button data-key="' + k + '">' + k + "</button>";
    }).join("") + '<button data-key="back" aria-label="지우기">' + icon("del") + '</button><button data-key="0">0</button>' +
      '<button class="ok" id="pinOk" data-act="sendPin">확인</button>';
    openSheet("pin", "<h2>TV 화면의 숫자 입력</h2><p>" +
      esc(wrong ? msg.replace(/[.\s]*$/, "") + ". 다시 입력하세요." : tvLabel(S.tv) + " 화면에 표시된 숫자를 입력하세요. 처음 한 번만 하면 됩니다.") + "</p>" +
      '<div class="pinbox" id="pinbox" aria-live="polite"></div><div class="keypad">' + keys + "</div>" +
      '<div class="acts"><button class="txt" data-act="usePrompt">숫자가 안 뜨면: TV에서 허용</button>' +
      '<button class="txt blue" data-act="cancel">취소</button></div>');
    renderPin();
  }
  function renderPin() {
    var box = $("pinbox"), ok = $("pinOk");
    if (!box) return;
    box.textContent = pinVal || "숫자 버튼을 누르세요";
    box.classList.toggle("empty", !pinVal);
    if (ok) ok.disabled = !pinVal;
  }
  function pinKey(k) {
    if (k === "back") pinVal = pinVal.slice(0, -1);
    else if (/^[0-9]$/.test(k) && pinVal.length < 16) pinVal += k;
    renderPin();
  }
  // 인증서가 바뀜: 기존 키는 보내지 않고, 다시 등록하면 진짜 TV 화면에만 숫자가 뜬다
  function showCertChanged(d) {
    var who = tvLabel(S.tv) + (d && d.model ? " · " + d.model : "") + " (" + (S.tv ? S.tv.ip : "") + ")";
    openSheet("cert", "<h2>TV 인증서가 바뀌었습니다</h2><p>" + esc(who) +
      "의 보안 인증서가 지난번과 다릅니다. TV를 초기화·업데이트했다면 정상일 수 있습니다.</p>" +
      "<p>다시 등록을 누르면 <b>TV 화면에 숫자</b>가 떠야 합니다. 숫자가 안 뜨면 다른 기기일 수 있으니 취소하세요.</p>" +
      '<div class="acts"><button class="txt" data-act="close">취소</button>' +
      '<button class="btn-acc" data-act="acceptCert">다시 등록</button></div>');
  }

  // ------------------------------------------------------------ 외부입력 패널
  // 목록: ssap://tv/getExternalInputList (실TV 미확인) → 실패하면 HDMI 1~3 기본 목록
  // 현재 입력: getForegroundAppInfo의 appId (com.webos.app.hdmi1 …)
  // 전환: switchInput {inputId} → 실패하면 같은 입력의 앱(appId)을 실행 (실TV 확인된 경로)
  var inputs = [], curApp = "";
  var LIVE = { id: "", label: "TV 방송", appId: "com.webos.app.livetv" };
  function defaultInputs() {
    return [1, 2, 3].map(function (n) { return { id: "HDMI_" + n, label: "HDMI " + n, appId: "com.webos.app.hdmi" + n }; });
  }
  function showInputs() {
    if (!connectedOrWarn()) return;
    inputs = []; curApp = "";
    renderInputs(true);
    rq("ssap://tv/getExternalInputList", null, function (d) {
      var devs = d.ok && d.payload && d.payload.devices;
      inputs = (devs && devs.length) ? devs.map(function (v) {
        return { id: v.id, label: v.label || v.id, appId: v.appId || "", connected: v.connected, icon: v.icon || "" };
      }) : defaultInputs();
      inputs.forEach(function (v) { needIcon(v.appId || v.id, v.icon); });
      if (S.sheet === "inputs") renderInputs(false, !(devs && devs.length));
    }, true);
    rq("ssap://com.webos.applicationManager/getForegroundAppInfo", null, function (d) {
      curApp = (d.ok && d.payload && d.payload.appId) || "";
      if (S.sheet === "inputs" && inputs.length) renderInputs(false);
    }, true);
  }
  var inputsFallback = false;
  function renderInputs(loading, fallback) {
    if (fallback != null) inputsFallback = fallback;
    var all = [LIVE].concat(inputs);
    var html = "<h2>외부입력</h2><p>" + esc(tvLabel(S.tv)) + (inputsFallback ? " · TV 목록을 못 받아 기본 목록 표시" : "") + "</p>";
    html += '<div class="list">' + (loading ? '<div class="empty"><span class="spin"></span> 입력 목록을 받는 중…</div>' :
      all.map(function (v, i) {
        var sel = curApp && v.appId && curApp === v.appId;
        var ic = i > 0 ? iconGet(v.appId || v.id) : null;
        return '<button class="item' + (sel ? " sel" : "") + '" data-input="' + i + '">' +
          (ic ? '<span class="inico"><img src="' + esc(ic.data) + '" alt=""></span>' : icon(i === 0 ? "tv" : "input")) +
          '<span class="t"><b>' + esc(v.label) + "</b>" + (v.connected === false ? "<small>연결된 기기 없음</small>" : "") + "</span>" +
          (sel ? '<span style="color:var(--tint-fg)">' + icon("check") + "</span>" : "") + "</button>";
      }).join("")) + "</div>";
    html += '<div class="acts"><span></span><button class="txt blue" data-act="close">닫기</button></div>';
    if (S.sheet === "inputs") { $("sheet").innerHTML = '<div class="grab"></div>' + html; }
    else openSheet("inputs", html);
  }
  function pickInput(i) {
    var v = [LIVE].concat(inputs)[i];
    if (!v) return;
    closeSheet();
    function launch() {
      if (!v.appId) { toast("전환 실패: " + v.label); return; }
      call("ssap://system.launcher/launch", { id: v.appId }, function (r) { if (r.ok) toast(v.label + "(으)로 전환"); });
    }
    if (!v.id) return launch();                                   // TV 방송은 앱 실행으로
    rq("ssap://tv/switchInput", { inputId: v.id }, function (d) {
      if (d.ok) toast(v.label + "(으)로 전환");
      else launch();                                              // switchInput이 안 되면 입력 앱 실행
    }, true);
  }

  // ------------------------------------------------------------ 디버그: 실TV에서 아직 확인 안 된 API를 눌러 보고 응답 원문 보기
  var DEBUG_TESTS = [
    { t: "MENU 버튼 (TV 설정)", btn: "MENU" },
    { t: "INFO 버튼", btn: "INFO" },
    { t: "채널 ▲ channelUp", uri: "ssap://tv/channelUp" },
    { t: "채널 ▼ channelDown", uri: "ssap://tv/channelDown" },
    { t: "외부입력 목록", uri: "ssap://tv/getExternalInputList" },
    { t: "현재 앱 / 입력", uri: "ssap://com.webos.applicationManager/getForegroundAppInfo" },
    { t: "switchInput HDMI_1", uri: "ssap://tv/switchInput", p: { inputId: "HDMI_1" } },
    { t: "switchInput HDMI_2", uri: "ssap://tv/switchInput", p: { inputId: "HDMI_2" } },
    { t: "HDMI 1 앱 실행", uri: "ssap://system.launcher/launch", p: { id: "com.webos.app.hdmi1" } },
    { t: "TV 방송 앱 실행", uri: "ssap://system.launcher/launch", p: { id: "com.webos.app.livetv" } },
    { t: "되감기 rewind", uri: "ssap://media.controls/rewind" },
    { t: "빨리감기 fastForward", uri: "ssap://media.controls/fastForward" },
    { t: "재생 play", uri: "ssap://media.controls/play" },
    { t: "일시정지 pause", uri: "ssap://media.controls/pause" },
    { t: "앱 목록 (아이콘 주소)", uri: "ssap://com.webos.applicationManager/listLaunchPoints", sum: "launch" },
    { t: "음량 상태", uri: "ssap://audio/getVolume" },
    { t: "아이콘 다시 받기", act: "icons" },
    { t: "Smart View 화면 목록", act: "sv" },
    { t: "화면 미러링 버튼 (현재 순서)", act: "cast" },
    { t: "진동 테스트", act: "haptic" },
    { t: "외부입력 패널 열기", act: "inputs" }
  ];
  var dbgLog = [];
  function showDebug() {
    var html = pageBar("API 테스트");
    html += '<p class="sect" style="font-weight:500">TV에 연결한 뒤 눌러 보세요. 결과(성공 여부·응답 원문)가 아래에 쌓입니다.</p>';
    html += '<div class="dbg">' + DEBUG_TESTS.map(function (x, i) {
      return '<button data-dbg="' + i + '">' + esc(x.t) + "</button>";
    }).join("") + "</div>";
    html += '<div class="dbg" id="svBox" style="margin-top:8px"><div class="empty" style="grid-column:1/-1">「Smart View 화면 목록」을 누르면 여기에 열기 버튼이 생깁니다</div></div>';
    html += '<div class="sect"><span>결과</span><button class="mini" data-act="dbgCopy" style="height:36px;padding:0 12px;font-size:13px">복사</button></div>' +
      '<div class="log" id="dbgLog"></div>';
    openPage("debug", html);
    renderLog();
  }
  function logLine(s) {
    var d = new Date();
    var ts = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2);
    dbgLog.unshift(ts + " " + s);
    if (dbgLog.length > 60) dbgLog.length = 60;
    renderLog();
  }
  function renderLog() { var el = $("dbgLog"); if (el) el.textContent = dbgLog.join("\n\n") || "(아직 없음)"; }
  function summarize(x, payload) {
    if (x.sum === "launch" && payload && payload.launchPoints) {
      var lp = payload.launchPoints;
      return "앱 " + lp.length + "개\n" + lp.slice(0, 8).map(function (a) {
        return a.id + " | " + a.title + " | icon=" + (a.icon || a.largeIcon || "");
      }).join("\n");
    }
    var s = JSON.stringify(payload);
    return s && s.length > 900 ? s.slice(0, 900) + " …(" + s.length + "자)" : s;
  }
  // Smart View 앱이 열어 둔 화면 목록 → 화면마다 '열기' 버튼 (어느 것이 미러링 화면인지 실기로 확인)
  function listCastTargets() {
    if (!B || !B.castTargets) { logLine("Smart View: 브리지에 없음"); return; }
    var r = {};
    try { r = JSON.parse(B.castTargets()); } catch (e) {}
    var acts = r.activities || [];
    logLine("Smart View " + (r.version || "") + (r.error ? " " + r.error : "") + " · 실행 인텐트 " + (r.launch ? "있음" : "없음") +
      " · 화면 " + acts.length + "개\n" + acts.map(function (a) {
        return (a.exported ? "[공개] " : "[비공개] ") + a.name + (a.enabled ? "" : " (꺼짐)");
      }).join("\n"));
    var box = $("svBox");
    if (box) box.innerHTML = acts.filter(function (a) { return a.exported; }).map(function (a) {
      return '<button data-sv="' + esc(a.name) + '">열기: ' + esc(a.name.split(".").pop()) + "</button>";
    }).join("") || '<div class="empty" style="grid-column:1/-1">공개된 화면이 없습니다</div>';
  }
  function runDebug(i) {
    var x = DEBUG_TESTS[i];
    if (!x) return;
    if (x.act === "haptic") { buzz(true); logLine("진동: haptic() 호출" + (B && B.haptic ? "" : " — 브리지에 없음")); return; }
    if (x.act === "inputs") { closePage(); showInputs(); return; }
    if (x.act === "cast") { logLine("화면 미러링 버튼 → 결과는 앱으로 돌아오면 표시"); act({ dataset: { act: "cast" } }); return; }
    if (x.act === "sv") { listCastTargets(); return; }
    if (x.act === "icons") {
      if (S.conn !== "connected") { logLine("아이콘: TV에 연결되지 않음"); return; }
      iconWant = {};
      logLine("아이콘 다시 받기 시작 (즐겨찾기 " + FAVORITES.length + "개)");
      loadAppIcons(true);
      return;
    }
    if (S.conn !== "connected") { logLine(x.t + ": TV에 연결되지 않음"); return; }
    if (x.btn) { logLine(x.t + ": button(" + x.btn + ") → " + (B.button(x.btn) ? "전송" : "전송 실패")); return; }
    logLine("→ " + x.t + "  " + x.uri + (x.p ? " " + JSON.stringify(x.p) : ""));
    rq(x.uri, x.p || null, function (d) {
      logLine("← " + x.t + ": " + (d.ok ? "성공 " + summarize(x, d.payload) : "실패 " + (d.error || "")));
    }, true);
  }

  // ------------------------------------------------------------ 연결 흐름
  // TV를 바꿀 때 이전 TV에 보낸 요청은 조용히 정리 ("응답 없음" 토스트가 잘못 뜨지 않게)
  function clearPending() {
    Object.keys(pending).forEach(function (k) { clearTimeout(pending[k].timer); });
    pending = {};
  }
  function connectTv(tv) {
    clearPending();
    S.tv = { id: tv.id, ip: tv.ip, name: tv.name || "" };
    S.conn = "connecting";
    render();
    if (S.page === "connect") showConnect();
    B.connect(tv.id);
  }
  function startDiscover(showPageToo) {
    if (S.searching) { if (showPageToo) showConnect(); return; }
    S.searching = true;
    S.found = [];
    render();
    if (showPageToo || S.page === "connect") showConnect();
    B.discover();
  }

  function onState(d) {
    // 다른 TV로 바꾼 뒤 늦게 온 이전 TV의 이벤트는 무시
    if (d.id && S.tv && S.tv.id && d.id !== S.tv.id) return;
    var prev = S.conn;
    S.conn = d.state;
    if (d.id) S.tv = { id: d.id, ip: d.ip, name: d.name || (S.tv && S.tv.name) || "" };
    render();
    switch (d.state) {
      case "connected":
        S.phase = "";
        if (S.sheet) closeSheet();
        if (S.page === "connect") closePage();
        else if (S.page === "settings") showSettings();
        if (prev !== "connected") { toast(tvLabel(S.tv) + " 연결됨"); loadAppIcons(false); }
        break;
      case "prompt":
        showPrompt();
        break;
      case "pin":
        showPin(d.message);
        break;
      case "failed":
        if (d.code === "cert_changed") { S.phase = ""; showCertChanged(d); break; }
        if (S.sheet === "prompt" || S.sheet === "pin" || S.sheet === "inputs") closeSheet();
        if (S.phase === "last") {           // 마지막 TV 실패 → 자동 검색
          S.phase = "discover";
          startDiscover(false);
        } else {
          toast("연결 실패: " + (d.message || ""));
          if (S.page === "connect") showConnect();
        }
        break;
      case "closed":
        if (S.sheet === "prompt" || S.sheet === "pin" || S.sheet === "inputs") closeSheet();
        if (S.page === "connect") showConnect();
        break;
    }
  }

  function onFound(t) {
    if (!S.found.some(function (f) { return f.id === t.id; })) S.found.push(t);
    if (S.page === "connect") showConnect();
  }

  function onDiscoverDone(d) {
    S.searching = false;
    render();
    if (S.conn === "connected" || S.conn === "connecting" || S.conn === "prompt" || S.conn === "pin") {
      if (S.page === "connect") showConnect();
      return;
    }
    if (d.error) toast("검색 오류: " + d.error);
    var auto = S.phase === "discover";
    S.phase = "";
    if (S.found.length === 1 && (auto || S.page !== "connect")) {
      if (S.page === "connect") closePage();
      connectTv(S.found[0]);
    } else {
      showConnect();
    }
  }

  // Kotlin → JS 이벤트 (ARCHITECTURE.md 3절)
  window.onBridge = function (type, dataJson) {
    var d = {};
    try { d = JSON.parse(dataJson); } catch (e) {}
    if (type === "state") onState(d);
    else if (type === "tvFound") onFound(d);
    else if (type === "discoverDone") onDiscoverDone(d);
    else if (type === "response") {
      if (d.id && S.tv && S.tv.id && d.id !== S.tv.id) return;   // 다른 TV의 응답은 무시
      var p = pending[d.reqId];
      if (p) { delete pending[d.reqId]; clearTimeout(p.timer); p.cb(d); }
    } else if (type === "error") { toast(d.message || "오류"); if (S.page === "debug") logLine("오류 이벤트: " + (d.message || "")); }
    else if (type === "theme") window.setTheme(!!d.dark);
    else if (type === "icon") onIcon(d);
    else if (type === "cast") {                      // 어떤 화면이 열렸는지 표시 (실기 확인용)
      var names = { cast_settings: "Google Cast 설정", smart_view: "Smart View", smart_view_dialog: "Smart View", display_settings: "디스플레이 설정" };
      castMsg = d.via === "none" ? "화면 전송 화면을 열 수 없습니다" : "열림: " + (names[d.via] || d.via);
      if (S.page === "debug") logLine("화면 전송 결과: " + d.via);
      toast(castMsg);                                 // 설정 화면으로 넘어가 못 볼 수 있어 돌아왔을 때 한 번 더
    }
  };

  // ------------------------------------------------------------ 명령
  function connectedOrWarn() {
    if (S.conn === "connected") return true;
    toast(S.conn === "prompt" ? "TV에서 '허용'을 먼저 눌러 주세요" : "TV에 연결되지 않았습니다");
    return false;
  }
  // ssap 요청. quiet면 실패 토스트 없이 결과만 cb로 (디버그·외부입력 대체 경로용)
  function rq(uri, payload, cb, quiet) {
    if (S.conn !== "connected") { if (!quiet) connectedOrWarn(); if (cb) cb({ ok: false, error: "연결 안 됨" }); return; }
    var id = "js_" + (++seq);
    pending[id] = {
      cb: function (d) {
        if (!d.ok && !quiet) toast("실패: " + (d.error || uri.replace("ssap://", "")));
        if (cb) cb(d);
      },
      timer: setTimeout(function () {
        if (!pending[id]) return;
        delete pending[id];
        if (!quiet) toast("TV 응답 없음");
        if (cb) cb({ ok: false, error: "응답 없음 (8초)" });
      }, 8000)
    };
    B.request(id, uri, payload ? JSON.stringify(payload) : "");
  }
  function call(uri, payload, cb) {
    if (!connectedOrWarn()) return;
    rq(uri, payload, cb, false);
  }
  function press(name) {
    if (!connectedOrWarn()) return;
    if (!B.button(name)) toast("버튼 전송 실패");
  }
  function toggleMute() {
    call("ssap://audio/getVolume", null, function (d) {
      if (!d.ok) return;
      var p = d.payload || {}, vs = p.volumeStatus || {};
      var muted = vs.muteStatus != null ? vs.muteStatus : (p.muted != null ? p.muted : !!p.mute);
      call("ssap://audio/setMute", { mute: !muted }, function (r) { if (r.ok) toast(muted ? "음소거 해제" : "음소거"); });
    });
  }
  // 재생/일시정지 한 버튼: TV에서 재생 상태를 받을 수 없어 번갈아 보낸다 (처음은 일시정지)
  var paused = false;
  function playPause() {
    var uri = paused ? "ssap://media.controls/play" : "ssap://media.controls/pause";
    call(uri, null, function (d) { if (d.ok) { paused = !paused; toast(paused ? "일시정지" : "재생"); } });
  }
  var powerTimer = null;
  function power() {
    var b = $("power");
    if (!b.classList.contains("armed")) {
      if (!connectedOrWarn()) return;
      b.classList.add("armed");
      toast("한 번 더 누르면 TV가 꺼집니다");
      powerTimer = setTimeout(disarm, 2500);
      return;
    }
    disarm();
    call("ssap://system/turnOff", null, function (d) { if (d.ok) toast("TV를 껐습니다"); });
  }
  function disarm() {
    clearTimeout(powerTimer);
    $("power").classList.remove("armed");
  }
  function buzz(force) {
    if ((haptic || force) && B && B.haptic) { try { B.haptic(); } catch (e) {} }
  }

  function act(b) {
    if (b.dataset.pick) {
      var id = b.dataset.pick;
      var t = S.found.filter(function (f) { return f.id === id; })[0] || savedById(id);
      if (!t) return;
      if (S.tv && S.tv.id === id && S.conn === "connected") { closePage(); return; }
      connectTv(t);
      return;
    }
    if (b.dataset.conn) {
      var ct = savedById(b.dataset.conn);
      closePage();
      if (ct) connectTv(ct);
      return;
    }
    if (b.dataset.forget) {                       // 두 번 눌러 해제
      if (!b.classList.contains("armed")) {
        b.classList.add("armed");
        b.textContent = "정말 해제?";
        setTimeout(function () { b.classList.remove("armed"); b.textContent = "등록 해제"; }, 2500);
        return;
      }
      var fid = b.dataset.forget;
      B.forget(fid);
      if (S.tv && S.tv.id === fid) { S.tv = null; S.conn = "idle"; render(); }
      toast("등록을 해제했습니다. 다시 연결하면 TV 화면의 숫자로 새로 등록합니다");
      showSettings();
      return;
    }
    if (b.dataset.key) {
      if (pinCleared) { pinCleared = false; return; }   // 길게 눌러 전부 지운 직후의 클릭은 무시
      return pinKey(b.dataset.key);
    }
    if (b.dataset.input) return pickInput(+b.dataset.input);
    if (b.dataset.dbg) return runDebug(+b.dataset.dbg);
    if (b.dataset.sv) { logLine("열기 시도: " + b.dataset.sv); B.openCastTarget(b.dataset.sv); return; }
    if (b.dataset.mode) return setMode(b.dataset.mode);
    if (b.dataset.launch) return call("ssap://system.launcher/launch", { id: b.dataset.launch });
    if (b.dataset.req) return call(b.dataset.req, null);
    if (b.dataset.btn) return press(b.dataset.btn);
    switch (b.dataset.act) {
      case "find": startDiscover(true); break;
      case "settings": showSettings(); break;
      case "debug": showDebug(); break;
      case "closePage": closePage(); break;
      case "tvcard":
        if (S.conn !== "connected" && S.tv && S.tv.id && S.conn !== "connecting") connectTv(S.tv);
        if (!S.searching && S.conn !== "connected") startDiscover(true); else showConnect();
        break;
      case "connectIp":
        var ipEl = $("ip"), ip = ipEl ? ipEl.value.trim() : "";
        if (!ip) { toast("IP를 입력하세요"); break; }
        closePage();
        clearPending();
        S.tv = { id: "", ip: ip, name: "" };
        S.conn = "connecting"; S.phase = "";
        render();
        B.connectIp(ip);
        break;
      case "close": closeSheet(); break;
      case "cancel": closeSheet(); B.disconnect(); break;
      case "sendPin":
        if (!pinVal) { toast("TV 화면의 숫자를 입력하세요"); break; }
        B.sendPin(pinVal);
        break;
      case "usePrompt": closeSheet(); if (S.tv && S.tv.id) { S.conn = "connecting"; render(); B.connectPrompt(S.tv.id); } break;
      case "acceptCert": closeSheet(); if (S.tv) { B.acceptCert(S.tv.id); connectTv(S.tv); } break;
      case "inputs": showInputs(); break;
      case "mute": toggleMute(); break;
      case "playPause": playPause(); break;
      case "toggleHaptic":
        haptic = !haptic; store("haptic", haptic ? "1" : "0");
        var sw = $("hapticSw"); if (sw) sw.classList.toggle("on", haptic);
        if (haptic) buzz();
        break;
      case "dbgCopy":
        try { navigator.clipboard.writeText(dbgLog.join("\n\n")); toast("복사했습니다"); } catch (e) { toast("복사 실패"); }
        break;
      case "cast": if (B && B.openCastSettings) B.openCastSettings(); else toast("앱에서만 동작합니다"); break;
      case "power": power(); break;
    }
  }

  // 탭 + 길게 누르면 반복 (볼륨, 방향키, 채널)
  var rep = null;
  function stopRepeat() { if (rep) { clearTimeout(rep.t); clearInterval(rep.i); rep = null; } }
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button, [data-act]");
    if (!b || b.disabled) return;
    if (b.dataset.repeat && rep && rep.fired) return;   // 반복으로 이미 보냄
    act(b);
  });
  document.addEventListener("pointerdown", function (ev) {
    var t = ev.target.closest && ev.target.closest(".wrap button, .keypad button");
    if (t) buzz();                                       // 리모컨·숫자판 버튼만 진동
    var b = ev.target.closest("button[data-repeat]");
    if (!b) return;
    stopRepeat();
    rep = { fired: false };
    rep.t = setTimeout(function () {
      rep.fired = true;
      act(b);
      rep.i = setInterval(function () { act(b); }, 180);
    }, 450);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (n) {
    document.addEventListener(n, function () { setTimeout(stopRepeat, 0); }, true);
  });
  $("dim").addEventListener("click", function () { if (S.sheet !== "prompt") closeSheet(); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "ip") act({ dataset: { act: "connectIp" } });
    if (S.sheet === "pin") act({ dataset: { act: "sendPin" } });
  });

  // ⌫ 길게 누르면 전부 지우기
  var pinCleared = false, pinHold = null;
  document.addEventListener("pointerdown", function (ev) {
    var b = ev.target.closest && ev.target.closest('[data-key="back"]');
    if (!b) return;
    pinHold = setTimeout(function () { pinVal = ""; pinCleared = true; renderPin(); }, 500);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (n) {
    document.addEventListener(n, function () { clearTimeout(pinHold); }, true);
  });
  // 실물 키보드가 있으면 숫자·지우기도 받음
  document.addEventListener("keydown", function (e) {
    if (S.sheet !== "pin") return;
    if (/^[0-9]$/.test(e.key)) pinKey(e.key);
    else if (e.key === "Backspace") pinKey("back");
  });

  // 안드로이드 뒤로 키: 시트 → 페이지(디버그는 설정으로) 순서로 닫기
  window.onBackKey = function () {
    if (S.sheet) { closeSheet(); return true; }
    if (S.page === "debug") { showSettings(); return true; }
    if (S.page) { closePage(); return true; }
    return false;
  };

  var castMsg = "";
  // 앱으로 돌아왔을 때 끊겨 있으면 다시 연결
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || !B) return;
    if (castMsg) { var m = castMsg; castMsg = ""; setTimeout(function () { toast(m); }, 300); }
    if ((S.conn === "closed" || S.conn === "failed") && S.tv && S.tv.id && !S.sheet) connectTv(S.tv);
  });

  // ------------------------------------------------------------ 방향키 | 터치패드
  var speed = parseFloat(load("cursor_speed")) || 1.5;   // 손가락 1px → TV 1.5단위 (화면 가로 ≈ 600~650)
  document.addEventListener("input", function (e) {
    if (e.target.id !== "speed") return;
    speed = parseFloat(e.target.value) || 1.5;
    store("cursor_speed", String(speed));
    var v = $("speedv"); if (v) v.textContent = speed.toFixed(1);
  });

  function setMode(m) {
    document.body.classList.toggle("mode-pad", m === "pad");
    Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function (x) {
      x.classList.toggle("on", x.dataset.mode === m);
    });
    store("ctrl_mode", m);
  }

  // 실TV 확인 (WEBOS_API.md 4절): 이동은 그대로, 클릭은 이동 직후에만, 스크롤은 10 단위·양수=위
  (function touchpad() {
    var pad = $("pad");
    var ptrs = {}, n = 0;
    var acc = { x: 0, y: 0 }, scrollAcc = 0;
    var g = null, timer = null, warned = false;
    var SCROLL_STEP_PX = 24;          // 두 손가락을 이만큼 움직일 때마다 스크롤 한 칸
    function sendMove(dx, dy) {
      if (!B.pointerMove(dx, dy) && !warned) { warned = true; toast("TV에 연결되지 않았습니다"); }
    }
    function flush() {
      var ix = acc.x < 0 ? Math.ceil(acc.x) : Math.floor(acc.x);
      var iy = acc.y < 0 ? Math.ceil(acc.y) : Math.floor(acc.y);
      if (ix || iy) { sendMove(ix, iy); acc.x -= ix; acc.y -= iy; }
    }
    pad.addEventListener("pointerdown", function (e) {
      if (!B || !connectedOrWarn()) return;
      e.preventDefault();
      try { pad.setPointerCapture(e.pointerId); } catch (x) {}
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY, t: e.timeStamp };
      n++;
      if (n === 1) { g = { t0: e.timeStamp, dist: 0, maxN: 1 }; warned = false; acc.x = acc.y = 0; scrollAcc = 0; }
      else if (g) g.maxN = Math.max(g.maxN, n);
      pad.classList.add("active");
      if (!timer) timer = setInterval(flush, 20);       // 약 20ms마다 모아서 전송
    });
    pad.addEventListener("pointermove", function (e) {
      var p = ptrs[e.pointerId];
      if (!p || !g) return;
      var dx = e.clientX - p.x, dy = e.clientY - p.y, dt = Math.max(1, e.timeStamp - p.t);
      p.x = e.clientX; p.y = e.clientY; p.t = e.timeStamp;
      g.dist += Math.abs(dx) + Math.abs(dy);
      if (n === 1 && g.maxN === 1) {
        var v = Math.sqrt(dx * dx + dy * dy) / dt;      // px/ms
        var accel = 1 + Math.min(1.5, v * 0.6);          // 빨리 밀면 더 멀리
        acc.x += dx * speed * accel;
        acc.y += dy * speed * accel;
      } else if (n >= 2) {
        scrollAcc += dy / n;                              // 손가락 평균 이동
        while (scrollAcc >= SCROLL_STEP_PX) { B.pointerScroll(10); scrollAcc -= SCROLL_STEP_PX; }    // 아래로 끌기 = 위쪽 내용
        while (scrollAcc <= -SCROLL_STEP_PX) { B.pointerScroll(-10); scrollAcc += SCROLL_STEP_PX; }
      }
    });
    function end(e) {
      if (!ptrs[e.pointerId]) return;
      delete ptrs[e.pointerId];
      n = Math.max(0, n - 1);
      if (n > 0) return;
      flush();
      clearInterval(timer); timer = null;
      pad.classList.remove("active");
      // 탭 = 클릭: 단독 click은 TV가 무시 → 살짝 이동 후 30ms 뒤 클릭
      if (g && g.maxN === 1 && g.dist < 10 && e.timeStamp - g.t0 < 300 && e.type === "pointerup") {
        if (!B.pointerTap() && !warned) { warned = true; toast("TV에 연결되지 않았습니다"); }
      }
      g = null;
    }
    pad.addEventListener("pointerup", end);
    pad.addEventListener("pointercancel", end);
    // 앱이 백그라운드로 가면 손가락 상태·누적값·타이머를 정리 (pointerup이 오지 않는 경우 대비)
    function resetPad() {
      ptrs = {}; n = 0; g = null; acc.x = acc.y = 0; scrollAcc = 0;
      clearInterval(timer); timer = null;
      pad.classList.remove("active");
    }
    document.addEventListener("visibilitychange", function () { if (document.visibilityState !== "visible") resetPad(); });
    window.addEventListener("blur", resetPad);
  })();

  // ------------------------------------------------------------ 시작
  setMode(load("ctrl_mode") === "pad" ? "pad" : "dpad");

  // 앱 아이콘: 저장된 TV 아이콘, 없으면 첫 글자 (연결되면 loadAppIcons가 받아 옴)
  renderApps();

  var verText = "브라우저 미리보기";
  if (!B) {
    render();
    return;
  }
  try { var info = JSON.parse(B.appInfo()); verText = "v" + info.version + " (빌드 " + info.build + ")"; } catch (e) {}

  var lastId = "";
  try { lastId = B.lastTv(); } catch (e) {}
  var lastTv = lastId ? savedById(lastId) : null;
  if (lastTv) {                 // 1) 마지막 TV로 바로 연결
    S.phase = "last";
    connectTv(lastTv);
  } else {                      // 2) 처음이면 검색
    S.phase = "discover";
    startDiscover(false);
  }
  render();
})();
</script>
</body>
</html>
