<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TV 리모컨</title>
<style>
:root{
  --bg:#111317; --panel:#1a1d23; --key:#252932; --key-hi:#2f3440; --line:#2d313a;
  --fg:#e8eaee; --mut:#8d95a3; --acc:#ff4d7d; --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.4 system-ui,-apple-system,"Noto Sans KR",sans-serif;user-select:none;-webkit-user-select:none}
.wrap{max-width:440px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
/* 상단 한 줄: TV 이름 · 상태 · 설정 */
.top{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.top .who{flex:1;min-width:0;background:none;padding:4px 0;text-align:left;font-size:17px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:6px}
.top .who:active{background:none;transform:none;opacity:.7}
.gear{width:38px;height:38px;font-size:18px;border-radius:50%;flex:none}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:6px;vertical-align:1px}
.pill.on{color:var(--ok)} .pill.on::before{background:var(--ok)}
.pill.wait{color:var(--warn)} .pill.wait::before{background:var(--warn)}
.pill.bad{color:var(--err)} .pill.bad::before{background:var(--err)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
button{font:inherit;color:var(--fg);background:var(--key);border:0;border-radius:12px;cursor:pointer;touch-action:manipulation}
button:active{background:var(--key-hi);transform:scale(.97)}
button:disabled{opacity:.45}
.btn-acc{background:var(--acc);color:#fff;padding:10px 16px;font-weight:600}
.btn-acc:active{background:#e23d6b}
.btn-sm{padding:7px 12px;font-size:13px}
.label{font-size:12px;color:var(--mut);margin:0 0 8px 2px}

/* 방향키 | 터치패드 전환 */
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:0 auto;max-width:220px}
.seg button{flex:1;padding:6px;font-size:13px;background:transparent;border-radius:8px;color:var(--mut)}
.seg button.on{background:var(--key-hi);color:var(--fg)}
.pad{display:none;width:100%;aspect-ratio:1/1.1;border-radius:18px;background:var(--key);border:1px dashed var(--line);
  touch-action:none;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:12px;line-height:1.7}
.pad.active{background:var(--key-hi)}
body.mode-pad .pad{display:flex}
body.mode-pad .dpad{display:none}
/* 설정 시트 */
.tvrow{display:flex;align-items:center;gap:8px;background:var(--key);border-radius:12px;padding:10px 12px}
.tvrow .t{flex:1;min-width:0}
.tvrow .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvrow .t small{color:var(--mut)}
.list .tvrow button{background:var(--key-hi);width:auto;flex:none;display:inline-block;padding:7px 12px;text-align:center}
.tvrow .danger{color:var(--err)}
.tvrow .danger.armed{background:var(--err);color:#fff}
.sect{font-size:12px;color:var(--mut);margin:14px 0 8px 2px}
.speed{display:flex;align-items:center;gap:10px}
.speed input{flex:1;padding:0}
input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;user-select:text;-webkit-user-select:text}

.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.app{height:54px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;line-height:1.2}

.middle{display:grid;grid-template-columns:64px 1fr 64px;gap:12px;align-items:center;margin:10px 0 14px}
.rocker{display:flex;flex-direction:column;background:var(--key);border-radius:32px;overflow:hidden}
.rocker button{background:transparent;height:64px;border-radius:0;font-size:24px}
.rocker button:active{background:var(--key-hi)}
.rocker span{text-align:center;font-size:11px;color:var(--mut);padding:2px 0}

.dpad{position:relative;width:100%;max-width:230px;aspect-ratio:1;margin:0 auto;border-radius:50%;background:var(--key)}
.dpad button{position:absolute;background:transparent;border-radius:0;font-size:22px;color:var(--mut)}
.dpad button:active{color:var(--fg);background:rgba(255,255,255,.06)}
.dpad .u{top:0;left:30%;width:40%;height:30%}
.dpad .d{bottom:0;left:30%;width:40%;height:30%}
.dpad .l{left:0;top:30%;width:30%;height:40%}
.dpad .r{right:0;top:30%;width:30%;height:40%}
.dpad .ok{top:30%;left:30%;width:40%;height:40%;border-radius:50%;background:var(--key-hi);color:var(--fg);font-size:16px;font-weight:700}

.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row button{height:48px;font-size:14px}
.power{color:var(--err);font-weight:700}
.power.armed{background:var(--err);color:#fff}

/* 아래에서 올라오는 시트: TV 선택, 허용 대기, PIN, 인증서 경고 */
.dim{position:fixed;inset:0;background:#0009;display:none;z-index:10}
.dim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.22s;max-height:80vh;overflow:auto}
.sheet.show{transform:translateY(0)}
.sheet h2{font-size:17px;margin:0 0 6px}
.sheet p{color:var(--mut);margin:0 0 12px;font-size:14px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.list{display:flex;flex-direction:column;gap:8px}
.list button{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;width:100%}
.list .t{flex:1;min-width:0}
.list .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .t small{color:var(--mut)}
.list .tag{font-size:11px;color:var(--ok)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:20;
  background:#000d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="who" id="tvName" data-act="pillTap">TV 리모컨</button>
    <span id="pill" class="pill" data-act="pillTap">연결 안 됨</span>
    <button class="gear" data-act="settings" aria-label="설정">⚙</button>
  </header>

  <div class="panel">
    <p class="label">앱 바로 실행</p>
    <div class="apps" id="apps"></div>
  </div>

  <div class="seg" id="seg">
    <button data-mode="dpad">방향키</button>
    <button data-mode="pad">터치패드</button>
  </div>

  <div class="middle">
    <div class="rocker">
      <button data-req="ssap://audio/volumeUp" data-repeat="1" aria-label="볼륨 올리기">＋</button>
      <span>음량</span>
      <button data-req="ssap://audio/volumeDown" data-repeat="1" aria-label="볼륨 내리기">－</button>
    </div>
    <div class="dpad">
      <button class="u" data-btn="UP" data-repeat="1" aria-label="위">▲</button>
      <button class="l" data-btn="LEFT" data-repeat="1" aria-label="왼쪽">◀</button>
      <button class="ok" data-btn="ENTER">확인</button>
      <button class="r" data-btn="RIGHT" data-repeat="1" aria-label="오른쪽">▶</button>
      <button class="d" data-btn="DOWN" data-repeat="1" aria-label="아래">▼</button>
    </div>
    <div class="pad" id="pad">드래그: 커서 이동<br>탭: 클릭<br>두 손가락 위아래: 스크롤</div>
    <div class="rocker">
      <button data-req="ssap://media.controls/play" aria-label="재생">▶</button>
      <span>재생</span>
      <button data-req="ssap://media.controls/pause" aria-label="일시정지">❚❚</button>
    </div>
  </div>

  <div class="row">
    <button data-btn="BACK">뒤로</button>
    <button data-btn="HOME">홈</button>
    <button data-act="mute">음소거</button>
    <button class="power" id="power" data-act="power">전원</button>
  </div>

  <footer id="ver"></footer>
</div>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  // 기본 즐겨찾기 — 실TV listLaunchPoints로 확인한 ID (WEBOS_API.md 5절)
  var FAVORITES = [
    { title: "YouTube", id: "youtube.leanback.v4" },
    { title: "Netflix", id: "netflix" },
    { title: "TVING", id: "cj.eandm" },
    { title: "wavve", id: "pooq" },
    { title: "쿠팡플레이", id: "coupangplay" },
    { title: "Disney+", id: "com.disney.disneyplus-prod" }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var B = window.AndroidBridge || null;

  // 화면 상태
  var S = {
    conn: "idle",        // idle | connecting | prompt | pin | connected | failed | closed
    tv: null,            // {id, ip, name}
    phase: "",           // 자동 흐름: "last"(마지막 TV 시도) → "discover"(검색) → ""
    searching: false,
    found: [],           // 이번 검색에서 찾은 TV
    sheet: ""            // 열린 시트 종류
  };
  var seq = 0, pending = {};

  // ------------------------------------------------------------ 공통 UI
  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function tvLabel(t) { return (t && (t.name || "").replace(/^\[LG\]\s*/, "")) || "LG TV"; }

  function render() {
    var pill = $("pill"), c = S.conn;
    var map = {
      idle: ["연결 안 됨", ""], closed: ["연결 끊김", ""], failed: ["연결 실패", "bad"],
      connecting: ["연결 중…", "wait"], prompt: ["TV에서 허용 대기", "wait"], pin: ["PIN 입력 대기", "wait"],
      connected: ["연결됨", "on"]
    };
    var m = map[c] || map.idle;
    if (S.searching && c !== "connected") m = ["TV 찾는 중…", "wait"];
    pill.textContent = m[0];
    pill.className = "pill " + m[1];
    $("tvName").textContent = S.tv ? tvLabel(S.tv) : "TV 리모컨";
    $("tvName").title = S.tv ? (S.tv.ip || "") : "";
  }

  // ------------------------------------------------------------ 시트
  function openSheet(kind, html) {
    S.sheet = kind;
    $("sheet").innerHTML = html;
    $("sheet").classList.add("show");
    $("dim").classList.add("show");
  }
  function closeSheet() {
    S.sheet = "";
    $("sheet").classList.remove("show");
    $("dim").classList.remove("show");
  }
  function showPicker() {
    var saved = [];
    try { saved = JSON.parse(B.savedTvs()); } catch (e) {}
    var byId = {};
    S.found.forEach(function (t) { byId[t.id] = t; });
    saved.forEach(function (t) { if (!byId[t.id]) byId[t.id] = t; });
    var items = Object.keys(byId).map(function (k) { return byId[k]; });
    var html = "<h2>TV 선택</h2>";
    html += S.searching ? '<p><span class="spin"></span>같은 Wi-Fi에서 찾는 중…</p>' : "<p>연결할 TV를 고르세요.</p>";
    html += '<div class="list">' + (items.length ? items.map(function (t) {
      var foundNow = S.found.some(function (f) { return f.id === t.id; });
      return '<button data-pick="' + esc(t.id) + '"><span class="t"><b>' + esc(tvLabel(t)) + "</b><small>" +
        esc(t.ip) + (t.model ? " · " + esc(t.model) : "") + (foundNow ? "" : " · 저장됨") + "</small></span>" +
        (t.known ? '<span class="tag">연결한 적 있음</span>' : "") + "</button>";
    }).join("") : (S.searching ? "" : "<p>찾은 TV가 없습니다. TV가 켜져 있는지, 같은 Wi-Fi인지 확인하거나 IP로 연결하세요.</p>")) + "</div>";
    html += '<div class="acts"><button class="btn-sm" data-act="settings">IP 직접 입력</button>' +
      '<button class="btn-sm" data-act="find">다시 찾기</button><button class="btn-sm" data-act="close">닫기</button></div>';
    openSheet("picker", html);
  }
  // ⚙ 설정: 저장된 TV(연결·등록 해제), TV 찾기, IP 직접 입력, 커서 속도, 앱 정보
  function showSettings(focusIp) {
    var saved = [];
    try { saved = JSON.parse(B.savedTvs()); } catch (e) {}
    var html = "<h2>설정</h2>";
    html += '<p class="sect">저장된 TV</p><div class="list">' + (saved.length ? saved.map(function (t) {
      var isCur = S.tv && S.tv.id === t.id && S.conn === "connected";
      return '<div class="tvrow"><span class="t"><b>' + esc(tvLabel(t)) + "</b><small>" + esc(t.ip) +
        (t.model ? " · " + esc(t.model) : "") + (isCur ? " · 연결됨" : "") + "</small></span>" +
        (isCur ? "" : '<button class="btn-sm" data-conn="' + esc(t.id) + '">연결</button>') +
        '<button class="btn-sm danger" data-forget="' + esc(t.id) + '">등록 해제</button></div>';
    }).join("") : '<p>아직 없습니다.</p>') + "</div>";
    html += '<p class="sect">TV 추가</p><div style="display:flex;gap:8px">' +
      '<button class="btn-sm" data-act="find" style="flex:none">TV 찾기</button>' +
      '<input id="ip" placeholder="IP 직접 입력 (예: 192.168.0.10)" inputmode="decimal" autocomplete="off">' +
      '<button class="btn-acc btn-sm" data-act="connectIp">연결</button></div>';
    html += '<p class="sect">터치패드 커서 속도</p><div class="speed"><span>느림</span>' +
      '<input type="range" id="speed" min="0.6" max="3" step="0.1" value="' + speed + '"><span>빠름</span>' +
      '<b id="speedv" style="width:34px;text-align:right">' + speed.toFixed(1) + "</b></div>";
    html += '<p class="sect">' + esc($("ver").textContent) + "</p>";
    html += '<div class="acts"><button class="btn-sm" data-act="close">닫기</button></div>';
    openSheet("settings", html);
    if (focusIp) setTimeout(function () { var i = $("ip"); if (i) i.focus(); }, 50);
  }
  function showPrompt() {
    openSheet("prompt", "<h2>TV 화면에서 '허용'을 눌러 주세요</h2><p>" + esc(tvLabel(S.tv)) +
      "에 연결 요청을 보냈습니다. 처음 한 번만 하면 됩니다.</p>" +
      '<div class="acts"><button class="btn-sm" data-act="cancel">취소</button></div>');
  }
  // 처음 등록: TV 화면에 뜬 숫자를 입력 (리모컨 불필요). 길이 제한 없음, 숫자만
  function showPin(msg) {
    var wrong = msg && msg.indexOf("맞지 않") >= 0;
    openSheet("pin", "<h2>TV 화면의 숫자 입력</h2><p>" +
      esc(wrong ? msg + " 다시 입력하세요." : tvLabel(S.tv) + " 화면에 표시된 숫자를 입력하세요. 처음 한 번만 하면 됩니다.") + "</p>" +
      '<div style="display:flex;gap:8px"><input id="pin" inputmode="numeric" pattern="[0-9]*" autocomplete="off">' +
      '<button class="btn-acc" data-act="sendPin">확인</button></div>' +
      '<div class="acts"><button class="btn-sm" data-act="usePrompt">숫자가 안 뜨면: TV에서 허용</button>' +
      '<button class="btn-sm" data-act="cancel">취소</button></div>');
    setTimeout(function () { var p = $("pin"); if (p) p.focus(); }, 50);
  }
  // 인증서가 바뀜: 기존 키는 보내지 않고, 다시 등록하면 진짜 TV 화면에만 숫자가 뜬다
  function showCertChanged(d) {
    var who = tvLabel(S.tv) + (d && d.model ? " · " + d.model : "") + " (" + (S.tv ? S.tv.ip : "") + ")";
    openSheet("cert", "<h2>TV 인증서가 바뀌었습니다</h2><p>" + esc(who) +
      "의 보안 인증서가 지난번과 다릅니다. TV를 초기화·업데이트했다면 정상일 수 있습니다.</p>" +
      "<p>다시 등록을 누르면 <b>TV 화면에 숫자</b>가 떠야 합니다. 숫자가 안 뜨면 다른 기기일 수 있으니 취소하세요.</p>" +
      '<div class="acts"><button class="btn-sm" data-act="close">취소</button>' +
      '<button class="btn-acc btn-sm" data-act="acceptCert">다시 등록</button></div>');
  }

  // ------------------------------------------------------------ 연결 흐름
  function connectTv(tv) {
    S.tv = { id: tv.id, ip: tv.ip, name: tv.name || "" };
    S.conn = "connecting";
    render();
    B.connect(tv.id);
  }
  function startDiscover(showSheet) {
    if (S.searching) { if (showSheet) showPicker(); return; }
    S.searching = true;
    S.found = [];
    render();
    if (showSheet) showPicker();
    B.discover();
  }

  function onState(d) {
    // 다른 TV로 바꾼 뒤 늦게 온 이전 TV의 이벤트는 무시
    if (d.id && S.tv && S.tv.id && d.id !== S.tv.id) return;
    var prev = S.conn;
    S.conn = d.state;
    if (d.id) S.tv = { id: d.id, ip: d.ip, name: d.name || (S.tv && S.tv.name) || "" };
    render();
    switch (d.state) {
      case "connected":
        S.phase = "";
        if (S.sheet && S.sheet !== "picker") closeSheet();
        if (S.sheet === "picker") closeSheet();
        if (prev !== "connected") toast(tvLabel(S.tv) + " 연결됨");
        break;
      case "prompt":
        showPrompt();
        break;
      case "pin":
        showPin(d.message);
        break;
      case "failed":
        if (d.code === "cert_changed") { S.phase = ""; showCertChanged(d); break; }
        if (S.sheet === "prompt" || S.sheet === "pin") closeSheet();
        if (S.phase === "last") {           // 마지막 TV 실패 → 자동 검색
          S.phase = "discover";
          startDiscover(false);
        } else {
          toast("연결 실패: " + (d.message || ""));
        }
        break;
      case "closed":
        if (S.sheet === "prompt" || S.sheet === "pin") closeSheet();
        break;
    }
  }

  function onFound(t) {
    if (!S.found.some(function (f) { return f.id === t.id; })) S.found.push(t);
    if (S.sheet === "picker") showPicker();
  }

  function onDiscoverDone(d) {
    S.searching = false;
    render();
    if (S.conn === "connected" || S.conn === "connecting" || S.conn === "prompt" || S.conn === "pin") {
      if (S.sheet === "picker") showPicker();
      return;
    }
    if (d.error) toast("검색 오류: " + d.error);
    var auto = S.phase === "discover";
    S.phase = "";
    if (S.found.length === 1 && (auto || S.sheet !== "picker")) {
      closeSheet();
      connectTv(S.found[0]);
    } else {
      showPicker();
    }
  }

  // Kotlin → JS 이벤트 (ARCHITECTURE.md 3절)
  window.onBridge = function (type, dataJson) {
    var d = {};
    try { d = JSON.parse(dataJson); } catch (e) {}
    if (type === "state") onState(d);
    else if (type === "tvFound") onFound(d);
    else if (type === "discoverDone") onDiscoverDone(d);
    else if (type === "response") {
      var p = pending[d.reqId];
      if (p) { delete pending[d.reqId]; clearTimeout(p.timer); p.cb(d); }
    } else if (type === "error") toast(d.message || "오류");
  };

  // ------------------------------------------------------------ 명령
  function connectedOrWarn() {
    if (S.conn === "connected") return true;
    toast(S.conn === "prompt" ? "TV에서 '허용'을 먼저 눌러 주세요" : "TV에 연결되지 않았습니다");
    return false;
  }
  function call(uri, payload, cb) {
    if (!connectedOrWarn()) return;
    var id = "js_" + (++seq);
    pending[id] = {
      cb: function (d) {
        if (!d.ok) toast("실패: " + (d.error || uri.replace("ssap://", "")));
        if (cb) cb(d);
      },
      timer: setTimeout(function () { if (pending[id]) { delete pending[id]; toast("TV 응답 없음"); } }, 8000)
    };
    B.request(id, uri, payload ? JSON.stringify(payload) : "");
  }
  function press(name) {
    if (!connectedOrWarn()) return;
    if (!B.button(name)) toast("버튼 전송 실패");
  }
  function toggleMute() {
    call("ssap://audio/getVolume", null, function (d) {
      if (!d.ok) return;
      var p = d.payload || {}, vs = p.volumeStatus || {};
      var muted = vs.muteStatus != null ? vs.muteStatus : (p.muted != null ? p.muted : !!p.mute);
      call("ssap://audio/setMute", { mute: !muted }, function (r) { if (r.ok) toast(muted ? "음소거 해제" : "음소거"); });
    });
  }
  var powerTimer = null;
  function power() {
    var b = $("power");
    if (!b.classList.contains("armed")) {
      if (!connectedOrWarn()) return;
      b.classList.add("armed");
      b.textContent = "끄기?";
      toast("한 번 더 누르면 TV가 꺼집니다");
      powerTimer = setTimeout(disarm, 2500);
      return;
    }
    disarm();
    call("ssap://system/turnOff", null, function (d) { if (d.ok) toast("TV를 껐습니다"); });
  }
  function disarm() {
    clearTimeout(powerTimer);
    var b = $("power");
    b.classList.remove("armed");
    b.textContent = "전원";
  }

  function act(b) {
    if (b.dataset.pick) {
      var id = b.dataset.pick;
      var t = S.found.filter(function (f) { return f.id === id; })[0];
      if (!t) { try { t = JSON.parse(B.savedTvs()).filter(function (f) { return f.id === id; })[0]; } catch (e) {} }
      closeSheet();
      if (t) connectTv(t);
      return;
    }
    if (b.dataset.conn) {
      var cid = b.dataset.conn, ct = null;
      try { ct = JSON.parse(B.savedTvs()).filter(function (f) { return f.id === cid; })[0]; } catch (e) {}
      closeSheet();
      if (ct) connectTv(ct);
      return;
    }
    if (b.dataset.forget) {                       // 두 번 눌러 해제
      if (!b.classList.contains("armed")) {
        b.classList.add("armed");
        b.textContent = "정말 해제?";
        setTimeout(function () { b.classList.remove("armed"); b.textContent = "등록 해제"; }, 2500);
        return;
      }
      var fid = b.dataset.forget;
      B.forget(fid);
      if (S.tv && S.tv.id === fid) { S.tv = null; S.conn = "idle"; render(); }
      toast("등록을 해제했습니다. 다시 연결하면 TV 화면의 숫자로 새로 등록합니다");
      showSettings();
      return;
    }
    if (b.dataset.mode) return setMode(b.dataset.mode);
    if (b.dataset.launch) return call("ssap://system.launcher/launch", { id: b.dataset.launch });
    if (b.dataset.req) return call(b.dataset.req, null);
    if (b.dataset.btn) return press(b.dataset.btn);
    switch (b.dataset.act) {
      case "find": startDiscover(true); break;
      case "settings": showSettings(S.sheet === "picker"); break;
      case "pillTap":
        if (S.conn === "connected") showSettings();
        else if (S.tv && S.tv.id) connectTv(S.tv);
        else startDiscover(true);
        break;
      case "connectIp":
        var ipEl = $("ip"), ip = ipEl ? ipEl.value.trim() : "";
        if (!ip) { toast("IP를 입력하세요"); break; }
        closeSheet();
        S.tv = { id: "", ip: ip, name: "" };
        S.conn = "connecting"; S.phase = "";
        render();
        B.connectIp(ip);
        break;
      case "close": closeSheet(); break;
      case "cancel": closeSheet(); B.disconnect(); break;
      case "sendPin":
        var pin = $("pin"), v = pin ? pin.value.replace(/\D/g, "") : "";
        if (!v) { toast("TV 화면의 숫자를 입력하세요"); break; }
        B.sendPin(v);
        break;
      case "usePrompt": closeSheet(); if (S.tv && S.tv.id) { S.conn = "connecting"; render(); B.connectPrompt(S.tv.id); } break;
      case "acceptCert": closeSheet(); if (S.tv) { B.acceptCert(S.tv.id); connectTv(S.tv); } break;
      case "mute": toggleMute(); break;
      case "power": power(); break;
    }
  }

  // 탭 + 길게 누르면 반복 (볼륨, 방향키)
  var rep = null;
  function stopRepeat() { if (rep) { clearTimeout(rep.t); clearInterval(rep.i); rep = null; } }
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button, [data-act]");
    if (!b || b.disabled) return;
    if (b.dataset.repeat && rep && rep.fired) return;   // 반복으로 이미 보냄
    act(b);
  });
  document.addEventListener("pointerdown", function (ev) {
    var b = ev.target.closest("button[data-repeat]");
    if (!b) return;
    stopRepeat();
    rep = { fired: false };
    rep.t = setTimeout(function () {
      rep.fired = true;
      act(b);
      rep.i = setInterval(function () { act(b); }, 180);
    }, 450);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (n) {
    document.addEventListener(n, function () { setTimeout(stopRepeat, 0); }, true);
  });
  $("dim").addEventListener("click", function () { if (S.sheet !== "prompt") closeSheet(); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "ip") act({ dataset: { act: "connectIp" } });
    if (e.target.id === "pin") act({ dataset: { act: "sendPin" } });
  });

  // 안드로이드 뒤로 키: 시트가 열려 있으면 닫기
  window.onBackKey = function () {
    if (S.sheet) { closeSheet(); return true; }
    return false;
  };

  // 앱으로 돌아왔을 때 끊겨 있으면 다시 연결
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || !B) return;
    if ((S.conn === "closed" || S.conn === "failed") && S.tv && S.tv.id && !S.sheet) connectTv(S.tv);
  });

  // ------------------------------------------------------------ 방향키 | 터치패드
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  var speed = parseFloat(load("cursor_speed")) || 1.5;   // 손가락 1px → TV 1.5단위 (화면 가로 ≈ 600~650)
  document.addEventListener("input", function (e) {
    if (e.target.id !== "speed") return;
    speed = parseFloat(e.target.value) || 1.5;
    store("cursor_speed", String(speed));
    var v = $("speedv"); if (v) v.textContent = speed.toFixed(1);
  });

  function setMode(m) {
    document.body.classList.toggle("mode-pad", m === "pad");
    Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function (x) {
      x.classList.toggle("on", x.dataset.mode === m);
    });
    store("ctrl_mode", m);
  }

  // 실TV 확인 (WEBOS_API.md 4절): 이동은 그대로, 클릭은 이동 직후에만, 스크롤은 10 단위·양수=위
  (function touchpad() {
    var pad = $("pad");
    var ptrs = {}, n = 0;
    var acc = { x: 0, y: 0 }, scrollAcc = 0;
    var g = null, timer = null, warned = false;
    var SCROLL_STEP_PX = 24;          // 두 손가락을 이만큼 움직일 때마다 스크롤 한 칸
    function sendMove(dx, dy) {
      if (!B.pointerMove(dx, dy) && !warned) { warned = true; toast("TV에 연결되지 않았습니다"); }
    }
    function flush() {
      var ix = acc.x < 0 ? Math.ceil(acc.x) : Math.floor(acc.x);
      var iy = acc.y < 0 ? Math.ceil(acc.y) : Math.floor(acc.y);
      if (ix || iy) { sendMove(ix, iy); acc.x -= ix; acc.y -= iy; }
    }
    pad.addEventListener("pointerdown", function (e) {
      if (!B || !connectedOrWarn()) return;
      e.preventDefault();
      try { pad.setPointerCapture(e.pointerId); } catch (x) {}
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY, t: e.timeStamp };
      n++;
      if (n === 1) { g = { t0: e.timeStamp, dist: 0, maxN: 1 }; warned = false; acc.x = acc.y = 0; scrollAcc = 0; }
      else if (g) g.maxN = Math.max(g.maxN, n);
      pad.classList.add("active");
      if (!timer) timer = setInterval(flush, 20);       // 약 20ms마다 모아서 전송
    });
    pad.addEventListener("pointermove", function (e) {
      var p = ptrs[e.pointerId];
      if (!p || !g) return;
      var dx = e.clientX - p.x, dy = e.clientY - p.y, dt = Math.max(1, e.timeStamp - p.t);
      p.x = e.clientX; p.y = e.clientY; p.t = e.timeStamp;
      g.dist += Math.abs(dx) + Math.abs(dy);
      if (n === 1 && g.maxN === 1) {
        var v = Math.sqrt(dx * dx + dy * dy) / dt;      // px/ms
        var accel = 1 + Math.min(1.5, v * 0.6);          // 빨리 밀면 더 멀리
        acc.x += dx * speed * accel;
        acc.y += dy * speed * accel;
      } else if (n >= 2) {
        scrollAcc += dy / n;                              // 손가락 평균 이동
        while (scrollAcc >= SCROLL_STEP_PX) { B.pointerScroll(10); scrollAcc -= SCROLL_STEP_PX; }    // 아래로 끌기 = 위쪽 내용
        while (scrollAcc <= -SCROLL_STEP_PX) { B.pointerScroll(-10); scrollAcc += SCROLL_STEP_PX; }
      }
    });
    function end(e) {
      if (!ptrs[e.pointerId]) return;
      delete ptrs[e.pointerId];
      n = Math.max(0, n - 1);
      if (n > 0) return;
      flush();
      clearInterval(timer); timer = null;
      pad.classList.remove("active");
      // 탭 = 클릭: 단독 click은 TV가 무시 → 살짝 이동 후 30ms 뒤 클릭
      if (g && g.maxN === 1 && g.dist < 10 && e.timeStamp - g.t0 < 300 && e.type === "pointerup") {
        sendMove(1, 0);
        setTimeout(function () { B.pointerClick(); }, 30);
      }
      g = null;
    }
    pad.addEventListener("pointerup", end);
    pad.addEventListener("pointercancel", end);
  })();

  // ------------------------------------------------------------ 시작
  setMode(load("ctrl_mode") === "pad" ? "pad" : "dpad");

  $("apps").innerHTML = FAVORITES.map(function (a) {
    return '<button class="app" data-launch="' + esc(a.id) + '">' + esc(a.title) + "</button>";
  }).join("");

  if (!B) {
    $("ver").textContent = "브라우저 미리보기 · 앱에서만 TV에 연결됩니다";
    render();
    return;
  }
  try { $("ver").textContent = "v" + JSON.parse(B.appInfo()).version; } catch (e) {}

  var lastId = "";
  try { lastId = B.lastTv(); } catch (e) {}
  var lastTv = null;
  if (lastId) {
    try { lastTv = JSON.parse(B.savedTvs()).filter(function (t) { return t.id === lastId; })[0]; } catch (e) {}
  }
  if (lastTv) {                 // 1) 마지막 TV로 바로 연결
    S.phase = "last";
    connectTv(lastTv);
  } else {                      // 2) 처음이면 검색
    S.phase = "discover";
    startDiscover(false);
  }
  render();
})();
</script>
</body>
</html>
